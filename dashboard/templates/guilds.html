{% extends "base.html" %}
{% block title %}Servers{% endblock %}
{% block content %}
<h1>Servers</h1>
<p class="sub">{{ rows|length }} guilds</p>
<table>
  <tr><th>Name</th><th>Members</th><th></th></tr>
  {% for g in rows %}
  <tr>
    <td>{{ g.name }}</td>
    <td>{{ g.members }}</td>
    <td><a href="/guilds/{{ g.id }}">view →</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
