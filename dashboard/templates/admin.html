{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<h1>Admin</h1>
<p class="sub">cogs · logs · restart</p>

<h1 style="font-size:18px">Cogs</h1>
<table>
  <tr><th>Extension</th><th style="width:260px">actions</th></tr>
  {% for e in exts %}
  <tr>
    <td><code>{{ e }}</code></td>
    <td>
      <form class="inline-form" method="post" action="/admin/cogs">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="ext" value="{{ e }}">
        <input type="hidden" name="action" value="reload">
        <button class="btn">reload</button>
      </form>
      <form class="inline-form" method="post" action="/admin/cogs">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="ext" value="{{ e }}">
        <input type="hidden" name="action" value="unload">
        <button class="ghost">unload</button>
      </form>
    </td>
  </tr>
  {% else %}<tr><td colspan="2">no extensions loaded</td></tr>{% endfor %}
</table>

<h1 style="margin-top:32px;font-size:18px">Live logs</h1>
<pre class="logs" id="logs">waiting for log lines…</pre>

<h1 style="margin-top:32px;font-size:18px">Danger zone</h1>
<form method="post" action="/admin/restart" data-confirm="Restart the bot? It will be back in ~10 seconds.">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="btn danger">Restart bot</button>
</form>
{% endblock %}
